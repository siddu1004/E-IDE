<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="var(--vscode-font-family, sans-serif)" font-size="14">
<style>.fg{fill:var(--vscode-foreground)}.mut{fill:var(--vscode-descriptionForeground)}.box{fill:var(--vscode-editorWidget-background);stroke:var(--vscode-widget-border, var(--vscode-contrastBorder, #8884))}.acc{fill:var(--vscode-button-background)}.acct{fill:var(--vscode-button-foreground)}.ln{stroke:var(--vscode-foreground);fill:none;stroke-width:2}</style>
<rect class="box" x="20" y="20" width="440" height="260" rx="8"/>
<text class="fg" x="40" y="54" font-weight="600">EEE APPS</text>
<circle class="acc" cx="48" cy="85" r="6"/><text class="fg" x="66" y="90">MATLAB / Simulink</text><text class="mut" x="300" y="90">Running</text>
<circle class="mut" cx="48" cy="129" r="6"/><text class="fg" x="66" y="134">KiCad</text><text class="mut" x="300" y="134">Installed</text>
<circle class="mut" cx="48" cy="173" r="6"/><text class="fg" x="66" y="178">LTspice</text><text class="mut" x="300" y="178">Installed</text>
<circle class="mut" cx="48" cy="217" r="6"/><text class="fg" x="66" y="222">Arduino IDE</text><text class="mut" x="300" y="222">Not installed</text>
<rect class="acc" x="300" y="234" width="140" height="28" rx="4"/><text class="acct" x="370" y="253" text-anchor="middle">Install</text>
</svg>
